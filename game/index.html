<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Vault — a stealth game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0e18; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #dfe6f2; }
  #app { display: flex; flex-direction: column; height: 100vh; }
  #hud {
    height: 56px; flex: 0 0 56px; display: flex; align-items: center; gap: 18px;
    padding: 0 18px; background: #10182a; border-bottom: 1px solid #22304d;
    font-size: 14px; white-space: nowrap; overflow: hidden;
  }
  #hud-level { font-weight: 700; color: #f5c542; }
  #hud-objective { color: #9fb0cc; }
  #hud-heat { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 160px; }
  #hud-heat-label { font-size: 12px; letter-spacing: 1px; color: #9fb0cc; width: 86px; text-align: right; }
  #hud-heat-label.alarm-text { color: #ff5252; font-weight: 700; }
  #hud-heat-bar { flex: 1; height: 10px; background: #1a2438; border-radius: 5px; overflow: hidden; max-width: 260px; }
  #hud-heat-fill { display: block; height: 100%; width: 0%; background: #3ddc84; transition: width 0.15s linear; }
  #hud-heat-fill.hot { background: #ffc93c; }
  #hud-heat-fill.alarm { background: #ff5252; }
  #hud-loot { color: #6ff2ff; }
  #hud-loot.got { color: #3ddc84; font-weight: 700; }
  #hud-coins { color: #ffd94a; }
  #hud-time { color: #dfe6f2; font-variant-numeric: tabular-nums; }
  #hud-hidden {
    display: none; color: #0a0e18; background: #8a93a8; border-radius: 4px;
    padding: 2px 8px; font-size: 12px; font-weight: 700; letter-spacing: 1px;
  }
  #hud-hidden.show { display: inline-block; }
  #stage { flex: 1; position: relative; min-height: 0; }
  #game { position: absolute; inset: 0; display: block; touch-action: none; }
  #hint {
    flex: 0 0 30px; display: flex; align-items: center; justify-content: center;
    background: #0d1322; color: #6c7d9c; font-size: 12px; letter-spacing: 0.4px;
  }
  #hint b { color: #9fb0cc; }
  #overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(5, 8, 16, 0.72); z-index: 10; cursor: pointer;
  }
  #overlay.hidden { display: none; }
  #ov-card {
    max-width: 560px; margin: 20px; padding: 34px 40px; text-align: center;
    background: rgba(16, 24, 42, 0.94); border: 1px solid #2b3a5c; border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
  }
  #ov-card h1 { margin: 0 0 6px; font-size: 34px; letter-spacing: 4px; color: #f5c542; }
  #ov-card .tag { margin: 0 0 14px; color: #6ff2ff; letter-spacing: 2px; font-size: 13px; text-transform: uppercase; }
  #ov-card p { margin: 10px 0; line-height: 1.55; color: #c6d2e6; font-size: 15px; }
  #ov-card .keys { color: #8fa1bd; font-size: 13px; }
  #ov-card .keys b { color: #f5c542; }
  #hud-message {
    position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
    background: rgba(16, 24, 42, 0.92); border: 1px solid #2b3a5c; border-radius: 6px;
    padding: 8px 16px; font-size: 14px; color: #f5c542; z-index: 5; pointer-events: none;
  }
  #hud-message:empty { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span id="hud-level">Level 1 — The Foyer</span>
    <span id="hud-objective">Steal the Star Sapphire</span>
    <span id="hud-heat">
      <span id="hud-heat-label">DETECTION</span>
      <span id="hud-heat-bar"><span id="hud-heat-fill"></span></span>
    </span>
    <span id="hud-loot">◆ Sapphire</span>
    <span id="hud-coins">● Coins × 3</span>
    <span id="hud-hidden">HIDDEN</span>
    <span id="hud-time">0:00</span>
  </div>
  <div id="stage">
    <canvas id="game" aria-label="Night Vault: sneak past the guards, steal the Star Sapphire, reach the green exit unseen"></canvas>
    <div id="hud-message"></div>
  </div>
  <div id="hint"><span><b>WASD / arrows</b> move &nbsp;·&nbsp; <b>click / Q</b> toss a coin &nbsp;·&nbsp; <b>P</b> pause &nbsp;·&nbsp; <b>R</b> restart &nbsp;·&nbsp; <b>M</b> mute</span></div>
</div>
<div id="overlay"><div id="ov-card"></div></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
